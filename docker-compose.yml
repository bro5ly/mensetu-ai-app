services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mensetu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mensetu_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-mensetu_ai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mensetu}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ollama:
  #   image: ollama/ollama:latest
  #   restart: unless-stopped
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   ports:
  #     - "11434:11434"
  #   environment:
  #     # 省メモリ設定（CPU 動作・低 RAM 環境で llama-server の OOM kill を避ける）
  #     - OLLAMA_FLASH_ATTENTION=1
  #     - OLLAMA_KV_CACHE_TYPE=q8_0
  #     - OLLAMA_MAX_LOADED_MODELS=1
  #     - OLLAMA_NUM_PARALLEL=1
  #     - OLLAMA_KEEP_ALIVE=5m
  #   # デフォルトは CPU 動作（Mac / GPU なし環境でもそのまま起動できる）。
  #   # Linux + NVIDIA GPU 環境では以下を有効にする:
  #   #   deploy:
  #   #     resources:
  #   #       reservations:
  #   #         devices:
  #   #           - driver: nvidia
  #   #             count: all
  #   #             capabilities: [gpu]

  faster-whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    restart: unless-stopped
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
    ports:
      - "8000:8000"
    volumes:
      - whisper-cache:/root/.cache

  voicevox:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    restart: unless-stopped
    ports:
      - "50021:50021"
    # command は上書きしない。イメージ既定の CMD が既に 0.0.0.0:50021 を LISTEN する。
    # `command: --host 0.0.0.0` を渡すと entrypoint.sh の `exec "$@"` が
    # `exec --host 0.0.0.0` になり「exec: --: invalid option」で即終了 → 再起動ループ。

volumes:
  postgres-data:
  # ollama-data:
  whisper-cache:
