services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mensetu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mensetu_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-mensetu_ai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mensetu}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NVIDIA GPU搭載機（Windows + Docker Desktop等）向け。既定の `docker compose up -d`
  # では起動しない。GPUでOllamaを動かしたい場合のみ
  # `docker compose --profile ollama-gpu up -d` のようにprofileを明示して起動する。
  # CPUが非力でもGPUがあるならこちらの方が速い（Macのネイティブ起動運用には影響しない）。
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["ollama-gpu"]
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=5m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  faster-whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    restart: unless-stopped
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
    ports:
      - "8000:8000"
    volumes:
      - whisper-cache:/root/.cache

  voicevox:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    restart: unless-stopped
    ports:
      - "50021:50021"
    # command は上書きしない。イメージ既定の CMD が既に 0.0.0.0:50021 を LISTEN する。
    # `command: --host 0.0.0.0` を渡すと entrypoint.sh の `exec "$@"` が
    # `exec --host 0.0.0.0` になり「exec: --: invalid option」で即終了 → 再起動ループ。

volumes:
  postgres-data:
  ollama-data:
  whisper-cache:
