spring:
  application:
    name: mensetu-ai-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:mensetu_ai}
    username: ${POSTGRES_USER:mensetu}
    password: ${POSTGRES_PASSWORD:mensetu_dev_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.1:8b}

server:
  port: ${SERVER_PORT:8080}

# Custom properties for external services
app:
  whisper:
    base-url: ${WHISPER_BASE_URL:http://localhost:8000}
    model: ${WHISPER_MODEL:base}
  voicevox:
    base-url: ${VOICEVOX_BASE_URL:http://localhost:50021}

logging:
  level:
    com.interviewapp: DEBUG
    org.springframework.ai: DEBUG
    org.hibernate.SQL: DEBUG

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  ai:
    ollama:
      base-url: http://mock-ollama:11434
