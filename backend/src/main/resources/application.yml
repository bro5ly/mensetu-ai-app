spring:
  application:
    name: mensetu-ai-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:mensetu_ai}
    username: ${POSTGRES_USER:mensetu}
    password: ${POSTGRES_PASSWORD:mensetu_dev_pass}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  ai:
    # LLM 呼び出しの失敗（Ollama 未起動・モデル読み込み失敗など）は、10 回リトライすると
    # ユーザーが 100 秒以上待たされてからエラー表示になる。ローカル開発の対話用途では
    # 素早く失敗させたいので試行回数と待ち時間を絞る。
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1s
        max-interval: 3s
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          # Ollamaはホスト（Mac）でネイティブ起動している前提（Docker Composeの対象外）。
          # 日本語の自然さを優先し、既定モデルは qwen3.5:4b。Docker上でCPU動作させる等
          # メモリに余裕がない環境では OLLAMA_MODEL を qwen3.5:2b/0.8b に落とす。
          # GPUに余裕があれば qwen3.5:9b に上げてもよい。
          model: ${OLLAMA_MODEL:qwen3.5:9b}

server:
  port: ${SERVER_PORT:8080}

# Custom properties for external services
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  whisper:
    base-url: ${WHISPER_BASE_URL:http://localhost:8000}
    model: ${WHISPER_MODEL:base}
  voicevox:
    base-url: ${VOICEVOX_BASE_URL:http://localhost:50021}
    speaker: ${VOICEVOX_SPEAKER:3}
    # 読み上げ速度倍率。生成完了から聞き終わるまでの体感時間を縮めるため既定を少し速めにしている。
    # 1.0が等倍、値を上げるほど速い(不自然にならない範囲は概ね1.0〜1.3程度)。
    speed-scale: ${VOICEVOX_SPEED_SCALE:1.1}
  sources:
    # 企業ソースURLの直接fetch(APIキー不要)。実際の外部ネットワーク呼び出しなので明示的にタイムアウトを設ける。
    fetch-timeout-ms: ${SOURCES_FETCH_TIMEOUT_MS:10000}
  searxng:
    # 自己ホストのSearXNG(APIキー不要、docker-compose.ymlの`searxng`サービス)。
    # 企業リサーチの初回検索で自動的にURL候補を探すのに使う。未起動でも検索結果0件で続行する。
    base-url: ${SEARXNG_BASE_URL:http://localhost:8081}

logging:
  level:
    com.interviewapp: DEBUG
    org.springframework.ai: DEBUG
    org.hibernate.SQL: DEBUG

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  ai:
    ollama:
      base-url: http://mock-ollama:11434
