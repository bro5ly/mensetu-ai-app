spring:
  application:
    name: mensetu-ai-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:mensetu_ai}
    username: ${POSTGRES_USER:mensetu}
    password: ${POSTGRES_PASSWORD:mensetu_dev_pass}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  ai:
    # LLM 呼び出しの失敗（Ollama 未起動・モデル読み込み失敗など）は、10 回リトライすると
    # ユーザーが 100 秒以上待たされてからエラー表示になる。ローカル開発の対話用途では
    # 素早く失敗させたいので試行回数と待ち時間を絞る。
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1s
        max-interval: 3s
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          # メモリの小さい環境でも起動できる軽量モデルを既定にする。
          # GPU があれば OLLAMA_MODEL=llama3.1:8b 等に上げる。
          model: ${OLLAMA_MODEL:llama3.2:3b}

server:
  port: ${SERVER_PORT:8080}

# Custom properties for external services
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  whisper:
    base-url: ${WHISPER_BASE_URL:http://localhost:8000}
    model: ${WHISPER_MODEL:base}
  voicevox:
    base-url: ${VOICEVOX_BASE_URL:http://localhost:50021}
    speaker: ${VOICEVOX_SPEAKER:3}

logging:
  level:
    com.interviewapp: DEBUG
    org.springframework.ai: DEBUG
    org.hibernate.SQL: DEBUG

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  ai:
    ollama:
      base-url: http://mock-ollama:11434
