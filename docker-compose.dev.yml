services:
  devcontainer:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace:cached
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    network_mode: service:postgres
    # network_mode: service:postgres なので、他サービスは localhost ではなく
    # サービス名で参照する（postgres だけは netns 共有で localhost:5432 が使える）。
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WHISPER_BASE_URL: http://faster-whisper:8000
      VOICEVOX_BASE_URL: http://voicevox:50021
    depends_on:
      - postgres
      - ollama
      - faster-whisper
      - voicevox

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mensetu
      POSTGRES_PASSWORD: mensetu_dev_pass
      POSTGRES_DB: mensetu_ai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mensetu"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    # GPU設定はMacでは不要（CPU動作）
    # Linux + NVIDIA GPU環境では docker-compose.dev.gpu.yml でオーバーライド可能

  faster-whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    restart: unless-stopped
    environment:
      - WHISPER_MODEL=base
    ports:
      - "8000:8000"
    volumes:
      - whisper-cache:/root/.cache

  voicevox:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    restart: unless-stopped
    ports:
      - "50021:50021"
    command: --host 0.0.0.0

volumes:
  postgres-data:
  ollama-data:
  whisper-cache:
