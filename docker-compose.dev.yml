services:
  devcontainer:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace:cached
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    network_mode: service:postgres
    # network_mode: service:postgres なので、他サービスは localhost ではなく
    # サービス名で参照する（postgres だけは netns 共有で localhost:5432 が使える）。
    environment:
      # 既定はホスト側でネイティブ起動しているOllamaに到達する
      # (`host.docker.internal`はDocker Desktop for Mac/Windowsで解決できる)。
      # GPU搭載機で下の`ollama`サービス(profile: ollama-gpu)を使う場合も、
      # ホストのポート11434に公開されるためこのデフォルトのままで到達できる。
      # 別ホスト/別ポートのOllamaを使う場合のみ、プロジェクト直下の.env
      # （gitignore対象・マシン固有）にOLLAMA_BASE_URLを書けば上書きされる。
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      WHISPER_BASE_URL: http://faster-whisper:8000
      VOICEVOX_BASE_URL: http://voicevox:50021
      SEARXNG_BASE_URL: http://searxng:8080
    depends_on:
      - postgres
      # - ollama
      - faster-whisper
      - voicevox
      - searxng

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mensetu
      POSTGRES_PASSWORD: mensetu_dev_pass
      POSTGRES_DB: mensetu_ai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mensetu"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NVIDIA GPU搭載機（Windows + Docker Desktop等）向け。既定の `docker compose up -d`
  # では起動しない。GPUでOllamaを動かしたい場合のみ
  # `docker compose -f docker-compose.dev.yml --profile ollama-gpu up -d` のように
  # profileを明示して起動する。ollamaコンテナはホストのポート11434に公開されるため、
  # devcontainer側は既定の `OLLAMA_BASE_URL=http://host.docker.internal:11434` の
  # ままで到達できる（.envの変更は不要）。Macのネイティブ起動運用には影響しない。
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["ollama-gpu"]
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=5m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  faster-whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    restart: unless-stopped
    environment:
      - WHISPER_MODEL=base
    ports:
      - "8000:8000"
    volumes:
      - whisper-cache:/root/.cache

  voicevox:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    restart: unless-stopped
    ports:
      - "50021:50021"
    # command は上書きしない。イメージ既定の CMD が
    #   gosu user python3 ./run.py --voicelib_dir ... --runtime_dir ... --host 0.0.0.0
    # で、既に 0.0.0.0:50021 を LISTEN する。`command: --host 0.0.0.0` を渡すと
    # entrypoint.sh の `exec "$@"` が `exec --host 0.0.0.0` となり
    # 「exec: --: invalid option」で即終了 → 再起動ループになる。

  # 企業リサーチの自動Web検索用(自己ホスト・APIキー不要のメタ検索エンジン)。
  # ./searxng/settings.yml でJSON API(GET /search?format=json)を有効化している。
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

volumes:
  postgres-data:
  ollama-data:
  whisper-cache:
